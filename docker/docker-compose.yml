# Minimal local Spark standalone cluster for the PGA Tour PySpark pipeline.
#
# One master + one worker, sized conservatively for a WSL2 environment that
# is capped at 6GB total RAM (see .wslconfig) and also has to leave room for
# the OS, the VS Code server, and a Jupyter kernel running alongside it.
#
# Image choice: the official Apache Spark image (apache/spark:4.2.0-python3)
# is used, matching the pyspark==4.2.0 pin in requirements.txt exactly.
#
# A local PySpark session on the host connects via master="spark://localhost:7077".
#
# The volumes: entries below bind-mount ../data (relative to THIS file, so
# it resolves correctly regardless of which machine/user checks the repo
# out) at ${PROJECT_ROOT}/data *inside* the containers -- i.e. the same
# absolute path data/ lives at on the host. That's required, not cosmetic:
# in client deploy mode the driver (running locally on the host, see
# src/transform.py) resolves/lists spark.read/write paths on ITS OWN local
# filesystem before any work ships to executors, so the path has to exist at
# that exact location on the host too, not just inside the containers.
# Mounting at a container-only path like /opt/spark/work-dir/data works for
# the executors but breaks driver-side path resolution.
#
# PROJECT_ROOT itself comes from docker/.env (gitignored, machine-specific --
# see docker/.env.example and docker/README.md for how to create it), so no
# host-specific path is hardcoded in this file.
#
# user: "${UID}:${GID}" (also from docker/.env) runs each container's Spark
# process as your own host uid/gid instead of the image's baked-in uid. This
# isn't just cosmetic either: spark.write with mode("overwrite") deletes and
# recreates its output directory on every run. The DRIVER (host, your uid)
# creates that top-level directory; the EXECUTOR (container) then has to
# create files/subdirectories inside it. If those are different uids, the
# executor's writes get rejected with a "Mkdirs failed" permission error
# after the driver-created directory comes back with a restrictive default
# mode. Matching uids sidesteps this instead of chmod'ing after every run.
#
# Running as an arbitrary uid needs an /etc/passwd entry for it, or several
# JVM/Hadoop codepaths (UserGroupInformation) fail outright at startup with
# a null-username LoginException. The image's entrypoint.sh has a
# nss_wrapper fallback for this (attempt_setup_fake_passwd_entry), but it
# only runs for the image's Kubernetes-mode `driver`/`executor` entrypoints
# -- our plain `spark-class ... Master/Worker` commands below hit the
# pass-through branch instead, which skips it. So we bind-mount the host's
# own /etc/passwd and /etc/group in read-only below, letting the container
# resolve your uid/gid the same way the host does, with no wrapper needed.
# (This assumes a Linux-style /etc/passwd on the host -- true for native
# Linux and WSL2, which this compose file already targets; unverified on
# macOS/Docker Desktop.)

services:
  spark-master:
    image: apache/spark:4.2.0-python3
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8080:8080"  # Spark Master web UI -> http://localhost:8080
      - "7077:7077"  # Master port -> spark://localhost:7077
      - "4040:4040"  # Spark application UI (job DAGs), for a driver run inside
                     # this container (e.g. via `docker compose exec spark-master
                     # spark-submit ...`). A driver run locally on the host already
                     # binds its own localhost:4040 without needing this mapping.
    volumes:
      - ../data:${PROJECT_ROOT}/data
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    user: "${UID}:${GID}"
    # Conservative Docker-enforced cap; the master is just bookkeeping/scheduling
    # and doesn't need much.
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - spark-network

  spark-worker:
    image: apache/spark:4.2.0-python3
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 2
      --memory 2g
      --webui-port 8081
    depends_on:
      - spark-master
    volumes:
      - ../data:${PROJECT_ROOT}/data
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    # The worker's own scratch directory (executor stdout/stderr, unpacked
    # app files -- separate from our data/ pipeline output) lives at
    # /opt/spark/work inside the image, owned by the image's baked-in uid.
    # Running as our own uid/gid above means we can't write there, so give
    # it a tmpfs instead: throwaway per-run scratch space, world-writable by
    # construction (mode 1777, like /tmp), no ownership conflict possible.
    tmpfs:
      - /opt/spark/work:mode=1777
    user: "${UID}:${GID}"
    # Docker-enforced cap matching the --memory/--cores the worker advertises
    # to Spark above. Well under the 6GB WSL2 budget, leaving room for the OS,
    # VS Code server, and a local Jupyter kernel/PySpark driver.
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
